name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  Warp_Chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: ls
      - name: prepare env
        run: |
          python3 -m pip install requests
          python3 main.py
      - name: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.BUILD_NAME }}
          path: build/release/*
          retention-days: 90
